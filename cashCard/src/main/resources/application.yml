spring :
  application :
    name : cashCard
  kafka:
    #if no consumer or producer specified
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: my-cqrs-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
#    consumer:
#      bootstrap-servers:
#    producer:
#      bootstrap-servers:
    #perform "Joins" or "Aggregations" and maintain a local state.
    #Because Kafka Streams creates many internal "changelog" topics,
    #some teams prefer to isolate this heavy traffic on a specific set of brokers optimized for high throughput.
#    streams:
#      bootstrap-servers:

cashCard :
  base_url: http://localhost:8080
