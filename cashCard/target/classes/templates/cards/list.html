<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Carte</title>
</head>
<body>
    <main layout:fragment="content">
        <h1>Le tue carte</h1>
        <table>
            <thead>
                <tr><th>ID</th><th>Intestatario</th><th>Stato</th><th>Saldo</th></tr>
            </thead>
            <tbody>
                <tr th:each="card : ${cards}">
                    <td th:text="${card.id}"></td>
                    <td th:text="${card.cardholderName}"></td>
                    <td th:text="${card.status}"></td>
                    <td th:text="${card.currentBalance}"></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
