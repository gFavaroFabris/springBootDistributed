  beservice:
    image: springbootdistributed-beservice
    build:
      context: .
      dockerfile: beService/Dockerfile
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - bankDb

  gatewayservice:
    image: springbootdistributed-gatewayservice
    build:
      context: ./gatewayService
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8083:8081"
    depends_on:
      - bankDb

