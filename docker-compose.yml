services:
  webapp:
    image: springbootdistributed-webapp
    build:
      context: ./webapp
      dockerfile: Dockerfile

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
  bankDb:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=bankDB
    ports:
      - "5433:5432"
    volumes:
      - bankDB_data:/var/lib/postgresql/data
      #- ./docs/data/administration:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bankDB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cashCard:
    build:
      context: ./cashCard
      dockerfile: Dockerfile
    image: distributed/cashcard:1.0
    restart: always
    ports:
      - "8081:8081"
      - "8080:8090"
    environment:
      - JWT_SECRET="AAAAAg_P)g%a.}X8rYpM~32qt-Zoei:w*kAnrix5)kyou!*g46x]Dkh?qTB9RDVA2"
      - KAFKA_SERVERS=kafka:9092 # Overrides localhost
      - CONSUMER_GROUP=orders-v1
      - BANK_DB=jdbc:postgresql://centralDB:5432/bankDB
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      kafka :
        condition: service_healthy
      bankDb :
        condition: service_healthy

  # camel:
