plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.12'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'it.gff.learn.structures'
version = '0.0.1-SNAPSHOT'
description = 'camel'

java {
    toolchain {
            languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter:4.22.0'
    implementation 'org.apache.camel:camel-jackson:4.22.0'
    implementation 'org.apache.camel:camel-jdbc:4.22.0'
    implementation 'org.apache.camel:camel-ftp:4.22.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.10.3'
}

tasks.named('test') {
    useJUnitPlatform()
}
