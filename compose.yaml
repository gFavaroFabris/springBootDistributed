services:
  webapp:
    image: springbootdistributed-webapp
    build:
      context: ./webapp
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - students_db

  camel:
    image: springbootdistributed-camel
    build:
      context: ./camel
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - students_db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://students_db:3306/studentsapp?createDatabaseIfNotExist=true
      - CAMEL_FTP_URI=ftp://studentsapp@studentsftp:21/students/export?password=stUd3nts@pp&passiveMode=true

  beservice:
    image: springbootdistributed-beservice
    build:
      context: ./beService
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - students_db

  gatewayservice:
    image: springbootdistributed-gatewayservice
    build:
      context: ./gatewayService
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8083:8081"
    depends_on:
      - students_db

#  studentsftp:
#    volumes:
#      - students-ftp:/ftp/studentsapp
#    image: "delfer/alpine-ftp-server"
#    ports:
#      - "21:21"
#      - "21000-21010:21000-21010"
#    environment:
#      - USERS=studentsapp|stUd3nts@pp

  students_db:
    volumes:
      - students-db:/var/lib/mysql
    image: "mysql:5.7"
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  students-db: