services:
  web:
    build: ./webapp
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - students_db

  camel:
    build: ./camel
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - students_db
      - studentsftp
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://students_db:3306/studentsapp?createDatabaseIfNotExist=true
      - CAMEL_FTP_URI=ftp://studentsapp@studentsftp:21/students/export?password=stUd3nts@pp&passiveMode=true

  studentsftp:
    volumes:
      - students-ftp:/ftp/studentsapp
    image: "delfer/alpine-ftp-server"
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - USERS=studentsapp|stUd3nts@pp

  students_db:
    volumes:
      - students-db:/var/lib/mysql
    image: "mysql:5.7"
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  students-db: